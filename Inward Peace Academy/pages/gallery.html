<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>School Gallery | Inward Peace Academy</title>
    <meta
      name="description"
      content="Explore classroom learning, school activities and special moments at Inward Peace Academy."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="School Gallery | Inward Peace Academy" />
    <meta
      property="og:description"
      content="A glimpse of learning and life at Inward Peace Academy."
    />
    <link rel="stylesheet" href="../css/style.css" />
    <!doctype html>
    <html lang="en-NG">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Gallery | Inward Peace Academy</title>
        <meta
          name="description"
          content="Browse photos of learning and school life at Inward Peace Academy."
        />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Gallery | Inward Peace Academy" />
        <meta
          property="og:description"
          content="A glimpse of learning, activities and school life."
        />
        <link rel="stylesheet" href="../css/style.css" />
      </head>
      <body data-page="gallery" data-root="../">
        <header data-site-header></header>
        <main id="main-content">
          <section class="page-hero page-hero--simple">
            <div class="container page-hero-inner">
              <p class="eyebrow">A window into school life</p>
              <h1>Little moments. Lasting memories.</h1>
            </div>
          </section>
          <section class="section">
            <div class="container">
              <div
                class="gallery-filters"
                role="group"
                aria-label="Filter gallery photos"
              >
                <button
                  class="filter-button"
                  type="button"
                  aria-pressed="true"
                  data-filter="all"
                >
                  All photos
                </button>
                <button
                  class="filter-button"
                  type="button"
                  aria-pressed="false"
                  data-filter="sports"
                >
                  Sports
                </button>
                <button
                  class="filter-button"
                  type="button"
                  aria-pressed="false"
                  data-filter="events"
                >
                  Events
                </button>
              </div>
              <div class="gallery-grid" data-gallery-grid>
                <button
                  class="gallery-item"
                  type="button"
                  data-category="events"
                  data-caption="Our school building — a welcoming place where learning and growth begin"
                >
                  <img
                    src="../images/school-life/school-building-front.jpeg"
                    alt="Front view of the Inward Peace Academy school building"
                    width="1600"
                    height="1067"
                    loading="lazy"
                  />
                  <span class="gallery-caption">School building</span>
                </button>
                <button
                  class="gallery-item"
                  type="button"
                  data-category="sports"
                  data-caption="Pupils taking part in a school sports-day procession"
                >
                  <img
                    src="../images/school-life/sports-day-parade.jpeg"
                    alt="Pupils in uniform carrying a banner during a school sports-day procession"
                    width="1080"
                    height="720"
                    loading="lazy"
                  />
                  <span class="gallery-caption">Sports</span>
                </button>
                <button
                  class="gallery-item"
                  type="button"
                  data-category="events"
                  data-caption="Pupils at an Inward Peace Academy school event"
                >
                  <img
                    src="../images/school-life/event-day.jpeg"
                    alt="Pupils gathered for an Inward Peace Academy school event"
                    width="1200"
                    height="800"
                    loading="lazy"
                  />
                  <span class="gallery-caption">Events</span>
                </button>
                <button
                  class="gallery-item"
                  type="button"
                  data-category="sports"
                  data-caption="Active, energetic and full of team spirit on the sports field"
                >
                  <img
                    src="../images/school-life/sports-activity.jpeg"
                    alt="Pupils taking part in an energetic sports activity at school"
                    width="1600"
                    height="1067"
                    loading="lazy"
                  />
                  <span class="gallery-caption">Sports</span>
                </button>
                <button
                  class="gallery-item"
                  type="button"
                  data-category="sports"
                  data-caption="A joyful school moment showing teamwork, confidence and active learning"
                >
                  <img
                    src="../images/school-life/school-activity.jpeg"
                    alt="Pupils participating in a lively school activity and learning together"
                    width="1600"
                    height="1067"
                    loading="lazy"
                  />
                  <span class="gallery-caption">School activity</span>
                </button>
                <button
                  class="gallery-item"
                  type="button"
                  data-category="sports"
                  data-caption="Pupils celebrating at a school sports event"
                >
                  <img
                    src="../images/school-life/sports-day-celebration.jpeg"
                    alt="Pupils celebrating as a trophy is presented at a school sports event"
                    width="1080"
                    height="720"
                    loading="lazy"
                  />
                  <span class="gallery-caption">Sports</span>
                </button>
              </div>
            </div>
          </section>
        </main>
        <dialog class="lightbox" aria-label="Enlarged gallery image">
          <button
            class="lightbox-close"
            type="button"
            aria-label="Close image viewer"
          >
            &times;
          </button>
          <img src="" alt="" />
          <p class="lightbox-caption"></p>
        </dialog>
        <footer data-site-footer></footer>
        <script src="../js/site.js" defer></script>
        <script src="../js/gallery.js" defer></script>
      </body>
    </html>
  </head>
</html>
